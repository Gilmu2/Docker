services:
  mongodb:
    image: 'mongo'
    volumes:
      - data:/data/db
    #container_name: mongodb
    #environment:
    #  - MONGO_INITDB_ROOT_USERNAME:max
    #env_file:
    # -./env/mongo.env

  backend:
    build: ./backend
    #build:
    # context: ./backend
    # dockerfile: Dockerfile
    volumes:
      - logs:/app/logs
      - ./backend:/app
      - /app/node_modules
    ports:
      - '80:80'
    depends_on:
      - mongodb
  frontend:
    build: ./frontend
    volumes:
      - ./frontend/src:/app/src
    ports:
      - '3000:3000'
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  data:
  logs:
